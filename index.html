<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Design V3 - Bain-Inspired Progress Slider</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-green: #1a4d3e;
            --lime-green: #c4d82e;
            --white: #ffffff;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
        }

        .hero-section {
            position: relative;
            height: 100vh;
            min-height: 600px;
            overflow: hidden;
            background: #000;
        }

        .hero-slider {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .hero-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 1;
        }

        .hero-slide.active {
            opacity: 1;
            z-index: 2;
        }

        /* Ken Burns Effect */
        .hero-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 6s ease;
        }

        .hero-slide.active img {
            transform: scale(1.1);
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.3) 50%, transparent 100%);
            z-index: 3;
        }

        .hero-content {
            max-width: 1100px;
            padding: 0 5vw 0 10vw;
            text-align: left;
            width: 100%;
        }

        .hero-tag {
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            color: var(--lime-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .hero-title {
            font-size: clamp(32px, 5vw, 72px);
            font-weight: 800;
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.1;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 34px;
            border-radius: 30px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .btn-outline {
            background: transparent;
            color: var(--white);
            border: 2px solid var(--white);
        }

        .btn-outline:hover {
            background: var(--white);
            color: var(--primary-green);
        }

        /* Hero Tabs with Progress */
        .hero-tabs {
            position: absolute;
            bottom: 50px;
            left: 10vw;
            right: 10vw;
            display: flex;
            gap: 30px;
            z-index: 100;
        }

        .hero-tab {
            flex: 1;
            padding-top: 15px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .hero-tab.active {
            color: #fff;
        }

        .tab-progress {
            position: absolute;
            top: -2px;
            left: 0;
            height: 2px;
            background: var(--lime-green);
            width: 0%;
        }

        .hero__scroll-indicator {
            position: absolute;
            bottom: 40px;
            right: 50px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 100;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(5px);}
            60% {transform: translateY(3px);}
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="hero-slider">
            <!-- Slide 1 -->
            <div class="hero-slide active">
                <img src="https://simphiwemtetwa.africa/wp-content/uploads/2026/04/SIMPHIWE-MTETWA-1920-x-825-mm-12-scaled.jpg" alt="Inequality">
                <div class="hero-overlay">
                    <div class="hero-content">
                        <span class="hero-tag">Social Justice</span>
                        <h1 class="hero-title">
                            Why Inequality Persists:<br>
                            The Unspoken Deal
                        </h1>
                        <a href="#" class="btn btn-outline">Read more</a>
                    </div>
                </div>
            </div>

            <!-- Slide 2 -->
            <div class="hero-slide">
                <img src="https://simphiwemtetwa.africa/wp-content/uploads/2026/04/SIMPHIWE-MTETWA-1920-x-825-mm-10-scaled.jpg" alt="Vision 2052">
                <div class="hero-overlay">
                    <div class="hero-content">
                        <span class="hero-tag">Strategic Vision</span>
                        <h1 class="hero-title">
                            A 25-Year Vision<br>
                            in Motion
                        </h1>
                        <a href="#" class="btn btn-outline">Explore Vision</a>
                    </div>
                </div>
            </div>

            <!-- Slide 3 -->
            <div class="hero-slide">
                <img src="https://simphiwemtetwa.africa/wp-content/uploads/2026/04/SIMPHIWE-MTETWA-1920-x-825-mm-11-scaled.jpg" alt="Podcast">
                <div class="hero-overlay">
                    <div class="hero-content">
                        <span class="hero-tag">Podcast</span>
                        <h1 class="hero-title">
                            Conversations That<br>
                            Shape The Future
                        </h1>
                        <a href="#" class="btn btn-outline">Listen Now</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="hero-tabs">
            <div class="hero-tab active">
                <div class="tab-progress"></div>
                Social Justice
            </div>
            <div class="hero-tab">
                <div class="tab-progress"></div>
                Strategic Vision
            </div>
            <div class="hero-tab">
                <div class="tab-progress"></div>
                Podcast
            </div>
        </div>

        <div class="hero__scroll-indicator">
            <span style="font-size: 10px; text-transform: uppercase; letter-spacing: 2px;">Scroll</span>
            <i class="fas fa-chevron-down"></i>
        </div>
    </section>

    <script>
        const slides = document.querySelectorAll('.hero-slide');
        const tabs = document.querySelectorAll('.hero-tab');
        const progressBars = document.querySelectorAll('.tab-progress');
        let currentSlide = 0;
        let slideInterval;
        let progressInterval;
        let startTime;
        const duration = 6000;

        function startSlider() {
            startTime = Date.now();
            updateProgress();
            slideInterval = setInterval(nextSlide, duration);
        }

        function updateProgress() {
            if (progressInterval) clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min((elapsed / duration) * 100, 100);
                if (progressBars[currentSlide]) {
                    progressBars[currentSlide].style.width = progress + '%';
                }
            }, 50);
        }

        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.remove('active');
                tabs[i].classList.remove('active');
                progressBars[i].style.width = '0%';
            });
            slides[index].classList.add('active');
            tabs[index].classList.add('active');
            currentSlide = index;
            startTime = Date.now();
            updateProgress();
            clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, duration);
        }

        function nextSlide() {
            let next = (currentSlide + 1) % slides.length;
            showSlide(next);
        }

        tabs.forEach((tab, index) => {
            tab.addEventListener('click', () => showSlide(index));
        });

        startSlider();
    </script>
</body>
</html>
